[package]
name = "calamares-nixos"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "NixOS-focused native Rust graphical installer"
publish = false

[features]
default = ["gui", "network"]
gui = ["dep:gtk", "network"]
network = ["dep:glib", "dep:gio"]

[dependencies]
anyhow = "=1.0.100"
libc = "=0.2.177"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha-crypt = "=0.5.0"
zeroize = { version = "=1.8.2", features = ["derive"] }
tempfile = "=3.23.0"
gtk = { package = "gtk4", version = "=0.10.3", optional = true }
glib = { version = "=0.21.5", optional = true }
gio = { version = "=0.21.5", optional = true }

[[bin]]
name = "calamares-nixos"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "calamares-nixos-helper"
path = "src/helper.rs"
